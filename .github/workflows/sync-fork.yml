name: Sync fork from upstream

# 上游 yang0/handraw-style 更新后，自动同步到本 fork（fengjunlu618/handraw-style）
on:
  schedule:
    - cron: '0 3 */3 * *'   # 每 3 天自动检查一次（UTC 时间凌晨 3 点，即北京时间上午 11 点）
  workflow_dispatch:        # 也可在 Actions 页手动点击运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/yang0/handraw-style.git || true
          git fetch upstream master
          git merge --no-edit upstream/master
          git push origin master
          echo "已同步：$(git rev-parse --short HEAD)"
